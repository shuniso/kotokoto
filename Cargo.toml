[package]
name = "kotokoto"
version = "0.1.1"
edition = "2021"
description = "キーを打つとコトコト鳴るだけの Windows 11 常駐アプリ"
license = "MIT"

[dependencies]
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
